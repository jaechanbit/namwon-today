name: Collect 남원시 소식

on:
  schedule:
    # 평일 한국시간 09:10, 12:10, 15:10, 18:10 (UTC 00:10~09:10)
    - cron: "10 0-9/3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: collect-and-deploy
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, Linux, X64, namwon-collector]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Collect and save articles
        run: npm run collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Generate AI summaries
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY가 없어 AI 요약을 건너뜁니다."
            exit 0
          fi
          npm run summarize

  deploy:
    needs: collect
    uses: ./.github/workflows/deploy-pages.yml
    secrets: inherit
